name: Setup
description: Select Xcode 27 and provide libghostty-vt (cached by the Ghostty pin).

runs:
  using: composite
  steps:
    # The newest Xcode 27 release on the runner (not a beta or release candidate).
    - name: Select Xcode 27
      shell: bash
      run: |
        xcode="$(ls -d /Applications/Xcode_27*.app | grep -E '/Xcode_27(\.[0-9]+)*\.app$' | sort -V | tail -1)"
        if [ -z "$xcode" ]; then
          echo "::error::No Xcode 27 on this runner. Installed: $(ls -d /Applications/Xcode*.app | xargs)"
          exit 1
        fi
        sudo xcode-select -s "$xcode"
        xcodebuild -version

    # libghostty-vt takes a few minutes to build; it only changes with the Ghostty pin.
    - name: Ghostty pin
      id: ghostty
      shell: bash
      run: echo "commit=$(git rev-parse HEAD:vendor/ghostty)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: HerdrKit/Frameworks/ghostty-vt.xcframework
        key: ghostty-vt-${{ steps.ghostty.outputs.commit }}-${{ hashFiles('justfile') }}
    - name: Build libghostty-vt
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        brew install just pixi
        just ghostty
