name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project is in Xcode 27's project format (project.xcproj) and builds with the iOS 27 SDK, so
# Xcode 26 can't build it, although the app runs on iOS 26. GitHub has Xcode 27 only on its
# `xcode-27` image (a preview, as of November 2026), not on `macos-26`.
jobs:
  herdrkit:
    name: HerdrKit tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # KeyStoreTests need the data protection keychain, which a CI runner's test process can't use.
      # The live tests skip themselves without a local herdr-core.
      - name: Test
        working-directory: HerdrKit
        run: swift test --skip KeyStoreTests

  app:
    name: App tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Builds the app for the simulator and runs its unit tests. The UI tests are left out: slow,
      # and the screenshot and video ones only run on request anyway.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project hirte.xcodeproj -scheme hirte -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath .build/xcode -only-testing:hirteTests \
            CODE_SIGNING_ALLOWED=NO test | xcbeautify
