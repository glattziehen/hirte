name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project is in Xcode 27's project format (project.xcproj) and builds with the iOS 27 SDK, so
# Xcode 26 can't build it, although the app runs on iOS 26. GitHub has Xcode 27 only on its
# `xcode-27` image (a preview, as of November 2026), not on `macos-26`.
jobs:
  herdrkit:
    name: HerdrKit tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest Xcode 27 release on the runner (not a beta or release candidate).
      - name: Select Xcode 27
        run: |
          xcode="$(printf "%s\n" /Applications/Xcode_27*.app | grep -E '/Xcode_27(\.[0-9]+)*\.app$' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed: $(echo /Applications/Xcode*.app)"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # libghostty-vt takes a few minutes to build; it only changes with the Ghostty pin (or the
      # justfile's build recipe). The submodule isn't checked out: the pin is read from the tree,
      # and `just ghostty` fetches it when needed (it has no submodules of its own).
      - name: Ghostty cache key
        id: ghostty
        run: echo "key=ghostty-vt-$(git rev-parse HEAD:vendor/ghostty)-$(shasum -a 256 justfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty-cache
        with:
          path: HerdrKit/Frameworks/ghostty-vt.xcframework
          key: ${{ steps.ghostty.outputs.key }}
      # pixi runs Zig for the build; there's no pixi project, only a global `just`.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        with:
          run-install: false
          global-environments: just
      - name: Build libghostty-vt
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: just ghostty

      # KeyStoreTests need the data protection keychain, which a CI runner's test process can't use.
      # The live tests skip themselves without a local herdr-core.
      - name: Test
        working-directory: HerdrKit
        run: swift test --skip KeyStoreTests

  # Builds the app and its tests for the simulator, without running them: booting a simulator on a
  # fresh runner took 5-7 minutes (November 2026), the 19 unit tests under a second.
  app:
    name: App build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The newest Xcode 27 release on the runner (not a beta or release candidate).
      - name: Select Xcode 27
        run: |
          xcode="$(printf "%s\n" /Applications/Xcode_27*.app | grep -E '/Xcode_27(\.[0-9]+)*\.app$' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner. Installed: $(echo /Applications/Xcode*.app)"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # libghostty-vt takes a few minutes to build; it only changes with the Ghostty pin (or the
      # justfile's build recipe). The submodule isn't checked out: the pin is read from the tree,
      # and `just ghostty` fetches it when needed (it has no submodules of its own).
      - name: Ghostty cache key
        id: ghostty
        run: echo "key=ghostty-vt-$(git rev-parse HEAD:vendor/ghostty)-$(shasum -a 256 justfile | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ghostty-cache
        with:
          path: HerdrKit/Frameworks/ghostty-vt.xcframework
          key: ${{ steps.ghostty.outputs.key }}
      # pixi runs Zig for the build; there's no pixi project, only a global `just`.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        with:
          run-install: false
          global-environments: just
      - name: Build libghostty-vt
        if: steps.ghostty-cache.outputs.cache-hit != 'true'
        run: just ghostty

      # Compiling the Swift packages (SwiftNIO, BoringSSL, Citadel…) is most of the build, so
      # their checkouts and build products are cached per Xcode build and package pins. Fresh
      # checkouts give the app's and HerdrKit's sources new timestamps, so those always rebuild.
      # (hashFiles() timed out on Package.resolved on the xcode-27 image, November 2026.)
      - name: Build cache key
        id: key
        run: |
          xcode="$(xcodebuild -version | tail -1 | awk '{print $3}')"
          pins="$(shasum -a 256 hirte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -c1-16)"
          echo "key=xcode-build-$xcode-$pins" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            .build/spm
            .build/xcode/Build
            .build/xcode/ModuleCache.noindex
          key: ${{ steps.key.outputs.key }}

      # NSUnbufferedIO keeps xcodebuild's output (and so the log's timestamps) live; no index store
      # saves build time. build-for-testing compiles the test targets too.
      - name: Build
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcodebuild -project hirte.xcodeproj -scheme hirte -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            -derivedDataPath .build/xcode -clonedSourcePackagesDirPath .build/spm \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build-for-testing | xcbeautify

      # Saved once per key; later runs only rebuild the app on top of it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            .build/spm
            .build/xcode/Build
            .build/xcode/ModuleCache.noindex
          key: ${{ steps.key.outputs.key }}
