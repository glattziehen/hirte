name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The project is in Xcode 27's project format (project.xcproj) and builds with the iOS 27 SDK, so
# Xcode 26 can't build it, although the app runs on iOS 26. GitHub has Xcode 27 only on its
# `xcode-27` image (a preview, as of November 2026), not on `macos-26`.
jobs:
  herdrkit:
    name: HerdrKit tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # KeyStoreTests need the data protection keychain, which a CI runner's test process can't use.
      # The live tests skip themselves without a local herdr-core.
      - name: Test
        working-directory: HerdrKit
        run: swift test --skip KeyStoreTests

  app:
    name: App tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # Boot the simulator now, so it starts up while the app compiles.
      - name: Boot a simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS")) | .value[]
             | select(.name == "iPhone 17")] | last | .udid')"
          if [ -z "$udid" ] || [ "$udid" = null ]; then
            echo "::error::No iPhone 17 simulator"; xcrun simctl list devices available; exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"

      # hashFiles() timed out on this file on the xcode-27 image (November 2026), so hash it here.
      - name: Package pins
        id: packages
        run: echo "hash=$(shasum -a 256 hirte.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/spm
          key: spm-${{ steps.packages.outputs.hash }}

      # Builds the app for the simulator, then runs its unit tests. The UI tests are left out: slow,
      # and the screenshot and video ones only run on request anyway. NSUnbufferedIO keeps
      # xcodebuild's output (and so the log's timestamps) live; no index store saves build time.
      - name: Build
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcodebuild -project hirte.xcodeproj -scheme hirte -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .build/xcode -clonedSourcePackagesDirPath .build/spm \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build-for-testing | xcbeautify

      - name: Test
        env:
          NSUnbufferedIO: "YES"
        run: |
          set -o pipefail
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          xcodebuild -project hirte.xcodeproj -scheme hirte -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath .build/xcode -clonedSourcePackagesDirPath .build/spm \
            -only-testing:hirteTests test-without-building | xcbeautify
